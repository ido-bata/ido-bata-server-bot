name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
# Resolver prefers the team's `type:*` labels and falls back to the
# generic labels documented in docs/process.md. This keeps release-drafter
# working both for hand-labelled PRs and for dependabot / chore / refactor
# PRs that may not carry a `type:*` label.
#
# Note on the resolver: release-drafter picks the LARGEST increment that
# matches a PR's labels. Each label must therefore appear in at most one
# bucket or it silently bumps the release higher than intended. We keep
# `type:feat` exclusively under `minor:` (a feature is a minor bump) and
# require an explicit `breaking` label for a major.
version-resolver:
  major:
    labels: ["breaking"]
  minor:
    labels: ["type:feat"]
  patch:
    labels: ["bug", "type:bug", "type:refactor", "type:chore", "type:test", "deps", "security", "dependencies"]
  default: patch

categories:
  - title: "🚨 Breaking changes"
    labels: ["breaking"]
  - title: "🚀 Added"
    labels: ["type:feat"]
  - title: "🔧 Changed"
    labels: ["change", "type:refactor", "type:chore"]
  - title: "🐛 Fixed"
    labels: ["bug", "type:bug"]
  - title: "🛡️ Security"
    labels: ["security"]
  - title: "📦 Dependencies"
    labels: ["deps", "dependencies"]
  - title: "📝 Documentation"
    labels: ["docs", "documentation"]

exclude-labels:
  - "skip-changelog"

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"

template: |
  ## Changes

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...HEAD
