name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs on the same PR / branch and avoid running duplicate work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint / type-check / test / build / analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
          # oven-sh/setup-bun@v2 ships a built-in cache keyed on bun.lock.
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format & import check
        run: bun run biome

      - name: Type-check
        run: bun run type-check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Unused code
        run: bun run knip

  container-build:
    name: Container build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only run the docker build when container files actually changed; PRs that
    # touch unrelated areas still get a fast gate.
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files, 'Containerfile') ||
      contains(github.event.pull_request.changed_files, 'compose.yml') ||
      contains(github.event.pull_request.changed_files, '.dockerignore')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image (smoke)
        # Pull the base image so the smoke build isn't gated on a cold cache.
        # `--load` makes the artifact visible to `docker image ls` for the
        # size check that follows.
        run: |
          docker buildx build \
            --file Containerfile \
            --target runtime \
            --tag ido-bata-server-bot:ci-smoke \
            --load \
            .

      - name: Verify image size budget (< 300 MB)
        # `docker image inspect --format` returns bytes; `numfmt` converts to MB.
        # Fail loudly if the runtime image exceeds the budget documented in
        # issue #27 acceptance criteria.
        run: |
          size_bytes=$(docker image inspect ido-bata-server-bot:ci-smoke --format '{{.Size}}')
          size_mb=$(numfmt --to=iec-i --suffix=B "$size_bytes" | awk '{print $1}')
          size_mb_int=${size_mb%.*}
          echo "Runtime image size: ${size_mb}"
          if [ "${size_mb_int}" -ge 300 ]; then
            echo "::error::Image size ${size_mb} exceeds 300 MB budget"
            exit 1
          fi

      - name: Validate compose.yml
        # `docker compose config` parses the file and resolves env_file
        # references. The smoke runs without secrets — only schema validation
        # is exercised here, never the runtime image.
        run: |
          touch .env
          docker compose --file compose.yml config > /dev/null