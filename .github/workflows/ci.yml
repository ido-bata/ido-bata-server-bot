name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs on the same PR / branch and avoid running duplicate work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint / type-check / test / build / analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
          # oven-sh/setup-bun@v2 ships a built-in cache keyed on bun.lock.
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format & import check
        run: bun run biome

      - name: Type-check
        run: bun run type-check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Unused code
        run: bun run knip

      - name: Audit production dependencies
        run: bun audit --production
