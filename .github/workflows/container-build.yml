name: Container build smoke

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - Containerfile
      - compose.yml
      - .dockerignore
      - src/features/container/**
      - .github/workflows/container-build.yml

# Cancel superseded runs on the same PR / branch.
concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container-build:
    name: Container build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image (smoke)
        # Pull the base image so the smoke build isn't gated on a cold cache.
        # `--load` makes the artifact visible to `docker image ls` for the
        # size check that follows.
        run: |
          docker buildx build \
            --file Containerfile \
            --target runtime \
            --tag ido-bata-server-bot:ci-smoke \
            --load \
            .

      - name: Verify image size budget (< 300 MB)
        # `docker image inspect --format` returns bytes. Compare the raw
        # byte count against the 300 MiB (300 * 1024 * 1024) budget — the
        # IEC suffix that `numfmt --to=iec-i` appends (e.g. `287MiB`) would
        # break an integer-only `[ ... -ge ]` test.
        run: |
          size_bytes=$(docker image inspect ido-bata-server-bot:ci-smoke --format '{{.Size}}')
          size_mib=$(numfmt --to=iec-i --suffix=B "$size_bytes" | awk '{print $1}')
          echo "Runtime image size: ${size_mib}"
          budget_bytes=$((300 * 1024 * 1024))
          if [ "${size_bytes}" -ge "${budget_bytes}" ]; then
            echo "::error::Image size ${size_mib} exceeds 300 MB budget"
            exit 1
          fi

      - name: Validate compose.yml
        # `docker compose config` parses the file and resolves env_file
        # references. The smoke runs without secrets — only schema validation
        # is exercised here, never the runtime image.
        run: |
          touch .env
          docker compose --file compose.yml config > /dev/null

      - name: Smoke-start the runtime image
        # A size check proves nothing about starting. The deployed command is
        # `node dist/index.js`; until this step existed, a build that emitted
        # `dist/src/index.js` (or imported a non-emitted `.jsx`) passed CI and
        # failed on every real deployment with MODULE_NOT_FOUND.
        #
        # No Discord token is available in CI, so the run is expected to end
        # at the login step. That is exactly what we want to observe: reaching
        # `failed to log in` proves the entrypoint resolved, every module
        # loaded, config validated, the health server bound and the storage
        # lease was acquired. A broken entrypoint stops much earlier with
        # ERR_MODULE_NOT_FOUND, which the assertions below reject.
        run: |
          set -uo pipefail
          docker run --rm \
            --name bot-smoke \
            --env DISCORD_TOKEN=ci-smoke-not-a-real-token \
            --env DISCORD_CLIENT_ID=1 \
            --env DISCORD_GUILD_ID=2 \
            --env DISCORD_ENABLE_MESSAGE_CONTENT=true \
            --env BOT_TUI=off \
            --env LOG_LEVEL=info \
            --env STORAGE_BACKEND=local \
            --env DATA_DIR=/app/data \
            --env HEALTH_HOST=127.0.0.1 \
            --env HEALTH_PORT=8080 \
            ido-bata-server-bot:ci-smoke > /tmp/bot-smoke.log 2>&1 || true

          echo "--- container log ---"
          cat /tmp/bot-smoke.log
          echo "--------------------"

          fail() {
            echo "::error::$1"
            exit 1
          }

          # A missing entrypoint or an unresolvable import is the failure this
          # step exists to catch.
          if grep -qE "ERR_MODULE_NOT_FOUND|Cannot find module" /tmp/bot-smoke.log; then
            fail "runtime image cannot resolve its own modules (entrypoint or import is wrong)"
          fi

          # Startup milestones, in the order the composition root reaches them.
          grep -q "health/metrics server listening" /tmp/bot-smoke.log \
            || fail "health server never bound — the entrypoint did not complete startup"
          grep -q "storage lease acquired" /tmp/bot-smoke.log \
            || fail "storage lease was never acquired"
          grep -q "failed to log in to Discord" /tmp/bot-smoke.log \
            || fail "process never reached the Discord login (startup did not run to completion)"

          # The invalid token must terminate the process instead of leaving a
          # container that answers /health while serving nothing.
          grep -q "Received FATAL" /tmp/bot-smoke.log \
            || fail "a rejected login did not route through the shutdown runner"

          echo "runtime image started, acquired the lease and failed loudly on the invalid token"
